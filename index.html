<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Vérif. d'âge</title>
<style>
/* VOICE: door-at-1am — blunt, huge, zero reading required
   IDEA: a bouncer's flashlight on a card: one bright frame in the dark
   PICTURE: the live camera with a card-shaped guide, then a full-screen verdict
   COLOUR and TYPE: near-black, verdict fills screen green/red/amber; Archivo 800
   LAYOUT: one column, thumb-reach buttons at the bottom */
:root{--bg:#0b0d10;--ink:#f3f4f6;--dim:#9aa3ad;--ok:#13a05b;--no:#d7263d;--warn:#e0a100}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.4 "Archivo",system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
header b{font-size:18px}
#count{color:var(--dim);font-size:15px}
#stage{position:relative;flex:1;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#guide{position:absolute;left:50%;top:50%;width:min(88%,560px);aspect-ratio:85.6/54;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
#hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:18px;text-shadow:0 1px 4px #000;padding:0 16px}
#scanline{position:absolute;left:4%;right:4%;height:3px;background:#fff;opacity:.7;top:10%;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{to{top:88%}}
@media(prefers-reduced-motion:reduce){#scanline{animation:none;top:50%}}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 16px}
button,.btn{min-height:56px;border:0;border-radius:14px;font:700 18px/1 inherit;font-family:inherit;color:var(--ink);background:#20252b;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
#verdict{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;z-index:5}
#verdict.show{display:flex}
#verdict.ok{background:var(--ok)}#verdict.no{background:var(--no)}#verdict.warn{background:var(--warn);color:#111}
#vBig{font-size:clamp(64px,22vw,150px);font-weight:800;line-height:1}
#vMsg{font-size:clamp(24px,7vw,40px);font-weight:800;margin-top:12px}
#vSub{font-size:20px;margin-top:14px;opacity:.9}
#vTap{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));font-size:16px;opacity:.85}
#manual{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;justify-content:center;gap:16px;padding:24px;z-index:4}
#manual.show{display:flex}
#manual label{font-size:20px;font-weight:700}
#manual input{font:700 28px/1 inherit;font-family:inherit;padding:14px;border-radius:12px;border:2px solid #444;background:#15191e;color:var(--ink);letter-spacing:2px}
#status{position:absolute;top:12px;left:12px;right:12px;text-align:center;color:var(--dim);font-size:14px}
.priv{color:var(--dim);font-size:13px;text-align:center;padding:0 16px 8px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/dist/iife/pure.js"></script>
</head>
<body>
<div id="app">
  <header><b>Vérification d'âge</b><span id="count">0 scans ce soir</span></header>
  <div id="stage">
    <video id="vid" playsinline muted autoplay></video>
    <div id="guide"><div id="scanline"></div></div>
    <div id="status">Démarrage de la caméra…</div>
    <div id="hint">Placez le <b>dos</b> du permis (code-barres) dans le cadre</div>
  </div>
  <div id="controls">
    <button id="bManual">Saisir la date</button>
    <button id="bPhoto">Prendre une photo</button>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
  </div>
  <div class="priv">Rien n'est enregistré : l'image et la date de naissance sont effacées après chaque vérification.</div>
</div>

<div id="verdict" role="alert"><div id="vBig"></div><div id="vMsg"></div><div id="vSub"></div><div id="vTap">Toucher pour le suivant</div></div>

<div id="manual">
  <label for="mDob">Date de naissance (AAAA-MM-JJ)</label>
  <input id="mDob" inputmode="numeric" placeholder="1998-04-23" autocomplete="off">
  <button id="mGo" style="background:var(--ok)">Vérifier</button>
  <button id="mCancel">Annuler</button>
</div>
<script>
// ---- Parsing: OCR text -> dates -> DOB / expiry ----
function fixDigits(s){return s.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2')}
function validDate(y,m,d){
  if(m<1||m>12||d<1||d>31)return null;
  const dt=new Date(Date.UTC(y,m-1,d));
  return dt.getUTCMonth()===m-1?dt:null;
}
function findDates(text){
  const t=fixDigits(text);
  const out=[];const seen=new Set();
  const add=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<1900||y>2100)return;const dt=validDate(y,m,d);if(!dt)return;const k=dt.toISOString().slice(0,10);if(!seen.has(k)){seen.add(k);out.push(dt)}};
  // YYYY-MM-DD, YYYY/MM/DD, YYYY.MM.DD, YYYY MM DD
  for(const m of t.matchAll(/(?<!\d)(19\d{2}|20\d{2})\s?[-\/. ]\s?(\d{2})\s?[-\/. ]\s?(\d{2})(?!\d)/g))add(m[1],m[2],m[3]);
  // DD-MM-YYYY
  for(const m of t.matchAll(/(?<!\d)(\d{2})\s?[-\/.]\s?(\d{2})\s?[-\/.]\s?(19\d{2}|20\d{2})(?!\d)/g))add(m[3],m[2],m[1]);
  // YYYYMMDD compact
  for(const m of t.matchAll(/(?<!\d)(19\d{2}|20\d{2})(\d{2})(\d{2})(?!\d)/g))add(m[1],m[2],m[3]);
  return out.sort((a,b)=>a-b);
}
function ageOn(dob,now){
  let a=now.getFullYear()-dob.getUTCFullYear();
  const md=(now.getMonth()+1)*100+now.getDate(), bd=(dob.getUTCMonth()+1)*100+dob.getUTCDate();
  if(md<bd)a--;return a;
}
// Licence card: DOB = earliest date that gives an age 10-110; expiry = latest date in the future-ish
function analyse(text,now=new Date()){
  const dates=findDates(text);
  const dobs=dates.filter(d=>{const a=ageOn(d,now);return a>=10&&a<=110});
  if(!dobs.length)return null;
  const dob=dobs[0];
  const later=dates.filter(d=>d>dob&&d.getUTCFullYear()>=now.getFullYear()-1);
  const exp=later.length?later[later.length-1]:null;
  const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  return {dob,age:ageOn(dob,now),exp,expired:exp?exp.getTime()<today:null};
}
// AAMVA PDF417 (Ontario, other provinces, US)
function parseAAMVA(raw,now=new Date()){
  const get=k=>{const m=raw.match(new RegExp('[\\n\\r\\x1e]'+k+'([^\\n\\r\\x1e]+)'));return m?m[1].trim():null};
  const iin=(raw.match(/ANSI\s?(\d{6})/)||[])[1]||'';
  const canada=/^(6360(1[0-9]|2[0-9])|604|636012|636028)/.test(iin)||/DCGCAN/.test(raw);
  const toDate=s=>{if(!s||!/^\d{8}$/.test(s))return null;
    const a=s.slice(0,4)>'1900'&&s.slice(0,4)<'2100'?validDate(+s.slice(0,4),+s.slice(4,6),+s.slice(6,8)):null; // CCYYMMDD
    const b=validDate(+s.slice(4,8),+s.slice(0,2),+s.slice(2,4)); // MMDDCCYY
    return canada?(a||b):(b||a)};
  const dob=toDate(get('DBB'));if(!dob)return null;
  const exp=toDate(get('DBA'));
  const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  return {dob,age:ageOn(dob,now),exp,expired:exp?exp.getTime()<today:null};
}
if(typeof module!=='undefined')module.exports={findDates,analyse,parseAAMVA,ageOn};
{
const LEGAL_AGE=18;
const $=id=>document.getElementById(id);
const vid=$('vid'),status=$('status');
let worker=null,busy=false,paused=false,lastKey=null,stream=null;
let barcode=null;

// ---- Counter: counts only, never personal data ----
const today=new Date().toISOString().slice(0,10);
let tally={day:today,n:0};
try{const s=JSON.parse(localStorage.getItem('tally')||'null');if(s&&s.day===today)tally=s}catch(e){}
const showCount=()=>$('count').textContent=tally.n+' scan'+(tally.n>1?'s':'')+' ce soir';
showCount();
function bump(){tally.n++;showCount();try{localStorage.setItem('tally',JSON.stringify(tally))}catch(e){}}

// ---- Verdict screen ----
const fmt=d=>d.toISOString().slice(0,10);
function verdict(r){
  paused=true;lastKey=null;bump();
  const v=$('verdict');v.className='show';
  if(!r){v.classList.add('warn');$('vBig').textContent='?';$('vMsg').textContent='Illisible';$('vSub').textContent='Vérifiez la carte à l\'œil.';}
  else if(r.age<LEGAL_AGE){v.classList.add('no');$('vBig').textContent=r.age+' ans';$('vMsg').textContent='MOINS DE 18 — REFUSER';$('vSub').textContent='Né(e) le '+fmt(r.dob);}
  else if(r.expired){v.classList.add('warn');$('vBig').textContent=r.age+' ans';$('vMsg').textContent='PERMIS EXPIRÉ';$('vSub').textContent='Expiré le '+fmt(r.exp)+' — demandez une autre pièce.';}
  else{v.classList.add('ok');$('vBig').textContent=r.age+' ans';$('vMsg').textContent='18+ — OK';$('vSub').textContent=r.exp?'Valide jusqu\'au '+fmt(r.exp):'Expiration non lue — vérifiez la carte.';}
  if(navigator.vibrate)navigator.vibrate(r&&r.age>=LEGAL_AGE&&!r.expired?80:[200,100,200]);
}
$('verdict').addEventListener('click',()=>{$('verdict').className='';['vBig','vMsg','vSub'].forEach(i=>$(i).textContent='');paused=false;});

// ---- Image prep: crop to guide, grayscale, stretch contrast ----
function grab(src,sw,sh){
  const c=document.createElement('canvas');
  const cw=sw*0.88,chh=cw*54/85.6;
  const sx=(sw-cw)/2,sy=Math.max(0,(sh-chh)/2);
  const scale=Math.min(1,1600/cw);
  c.width=Math.round(cw*scale);c.height=Math.round(Math.min(chh,sh)*scale);
  const g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(src,sx,sy,cw,Math.min(chh,sh),0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height),p=im.data;let lo=255,hi=0;
  for(let i=0;i<p.length;i+=4){const y=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;p[i]=y;if(y<lo)lo=y;if(y>hi)hi=y}
  const k=255/Math.max(1,hi-lo);
  for(let i=0;i<p.length;i+=4){const y=(p[i]-lo)*k;p[i]=p[i+1]=p[i+2]=y}
  g.putImageData(im,0,0);return c;
}
function wipe(c){const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);c.width=c.height=0}

// ---- Read one frame ----
// Back of card: PDF417 barcode (Quebec since 2024 cards, Ontario, US). Front: OCR fallback.
async function readBarcode(src){
  if(!barcode)return null;
  try{const codes=await barcode.detect(src);for(const c of codes){const r=parseAAMVA(c.rawValue);if(r)return r}}catch(e){}
  return null;
}
async function readOCR(src,w,h,single){
  if(!worker)return null;
  const c=grab(src,w,h);
  try{const {data}=await worker.recognize(c);const r=analyse(data.text||'');
    if(!r)return null;
    if(single)return r;
    const key=fmt(r.dob);        // front: require the same DOB on two frames in a row
    if(key===lastKey)return r;lastKey=key;return null;
  }finally{wipe(c)}
}
async function readFrame(src,w,h,single){
  return (await readBarcode(src))||(await readOCR(src,w,h,single));
}

let tick=0;
async function loop(){
  if(!paused&&!busy&&vid.readyState>=2){
    busy=true;
    try{
      let r=await readBarcode(vid);                       // fast: every tick
      if(!r&&++tick%4===0)r=await readOCR(vid,vid.videoWidth,vid.videoHeight,false); // slow: every 4th
      if(r&&!paused)verdict(r);
    }catch(e){}
    busy=false;
  }
  setTimeout(loop,150);
}

// ---- Photo fallback (no live camera, or tricky lighting) ----
$('bPhoto').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  paused=true;status.textContent='Lecture…';
  const img=await createImageBitmap(f);
  try{const r=await readFrame(img,img.width,img.height,true);verdict(r||null)}
  finally{img.close&&img.close();status.textContent='';}
};

// ---- Manual entry ----
$('bManual').onclick=()=>{paused=true;$('manual').classList.add('show');$('mDob').value='';$('mDob').focus()};
$('mCancel').onclick=()=>{$('manual').classList.remove('show');paused=false};
$('mDob').addEventListener('input',e=>{let d=e.target.value.replace(/\D/g,'').slice(0,8);if(d.length>6)d=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);else if(d.length>4)d=d.slice(0,4)+'-'+d.slice(4);e.target.value=d});
$('mGo').onclick=()=>{const r=analyse($('mDob').value);$('manual').classList.remove('show');$('mDob').value='';verdict(r&&{...r,exp:null,expired:null}||null)};

// ---- Start ----
(async()=>{
  try{
    if('BarcodeDetector' in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('pdf417'))barcode=new BarcodeDetector({formats:['pdf417']})}
  }catch(e){}
  try{ // iPhone / desktop: same engine via WebAssembly
    if(!barcode&&window.BarcodeDetectionAPI)barcode=new BarcodeDetectionAPI.BarcodeDetector({formats:['pdf417']});
  }catch(e){}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
    vid.srcObject=stream;
    const t=stream.getVideoTracks()[0],cap=t.getCapabilities?t.getCapabilities():{};
    if(cap.focusMode&&cap.focusMode.includes('continuous'))t.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  }catch(e){status.textContent='Caméra non disponible — utilisez « Prendre une photo ».';$('scanline').style.display='none'}
  if(stream){status.textContent='';loop();}
  try{
    worker=await Tesseract.createWorker('eng');
    await worker.setParameters({tessedit_pageseg_mode:'11'});
  }catch(e){if(!barcode)status.textContent='Lecteur non chargé (connexion ?). Saisie manuelle disponible.'}
})();
}
</script>
</body>
</html>
